certificates:
  - name: OffSec Certified Professional+ (OSCP+)
    issuer: OffSec
    date: 2026-07-01
    expiryDate: 2029-07-01
    credentialId: '188535197'
    url: https://credentials.offsec.com/2ecbb21c-d6e5-4d0d-a5ca-5c6a0d8115b4
    summary: >-
      An OSCP+ has demonstrated the ability to use persistence, creativity, and perceptiveness to
      identify vulnerabilities and execute organized attacks under tight time constraints.
      Includes the lifetime OSCP.
  - name: OffSec Certified Professional (OSCP)
    issuer: OffSec
    date: 2026-07-01
    credentialId: '188535160'
    url: https://credentials.offsec.com/2e6b12bd-0ff9-48f0-b872-2b4f9a266e14
    summary: >-
      An OSCP has demonstrated the ability to use persistence, creativity, and perceptiveness to
      identify vulnerabilities and execute organized attacks under tight time constraints.
    custom:
      portfolio:
        supersededBy: OffSec Certified Professional+ (OSCP+)
  - name: OffSec Defense Analyst (OSDA)
    issuer: OffSec
    date: 2024-12-19
    credentialId: '127045920'
    url: https://credentials.offsec.com/ecd21884-5cee-4907-9241-d83389bcfcfa
    summary: >-
      OffSec Defense Analysts (OSDAs) have the skills and expertise needed to detect, uncover, and
      understand cyber attacks against an organization. They can analyze security logs across
      operating systems and applications, chain findings to map full attack paths, and build
      detection rules and analysis scripts.
