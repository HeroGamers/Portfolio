# yaml-language-server: $schema=https://raw.githubusercontent.com/jsonresume/jsonresume.org/master/packages/schema/schema.json
#
# Resume data in the JSON Resume format (https://jsonresume.org/schema).
# Everything shown on the portfolio is read from this file.
#
# Portfolio-specific conventions:
# - Positions at the same company/organization are grouped into one card, in file order.
#   The card description is the `summary` of the first position listed for that company.
# - `custom.portfolio.employmentType` sets the employment type shown for work positions;
#   volunteer positions are always shown as "Volunteer Work".
# - `custom.portfolio.supersededBy` on a certificate hides it while the named certificate
#   is unexpired (checked at build time).
# - The email address is deliberately left out, as it is obfuscated on the site.

