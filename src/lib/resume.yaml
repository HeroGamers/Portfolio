work:
  - name: TDC Erhverv
    position: Security Operations Center Analyst
    startDate: 2024-07-01
    summary: >-
      At TDC Erhverv, a company under the TDC Group (telecommunications), I gained extensive
      experience in cybersecurity operations through my role as a SOC Analyst. I analyzed complex
      security incidents, supported Managed Detection and Response (MDR) using different SIEM
      platforms, and developed use cases and detection rules to enhance monitoring capabilities. I
      optimized workflows by improving SOAR automation, co-managed anti-DDoS solutions, and
      developed and refined security tools. My responsibilities also included conducting proactive
      threat hunting, integrating threat intelligence into operations, and coordinating effective
      incident response plans. Additionally, I engaged with the cybersecurity community by
      participating in conferences and industry events, further expanding my knowledge and
      expertise in the field. I have also represented TDC Erhverv as an observer at NATO CCDCOE
      exercises such as Locked Shields, the world's largest live-fire cyber defence exercise.
    custom:
      portfolio:
        employmentType: Full-time
  - name: TDC Erhverv
    position: Security Operations Center Intern
    startDate: 2024-02-01
    endDate: 2024-07-01
    custom:
      portfolio:
        employmentType: Internship

volunteer:
  - organization: Kalmarunionen
    position: Board Member - Accountant
    startDate: 2025-07-01
    summary: >-
      Team member of the CTF (Capture The Flag) team, Kalmarunionen. CTF is a cybersecurity
      competition that is used to test and develop computer security skills. Kalmarunionen has
      finished in the global top 3 of competitive hacking three years running (3rd in 2023, 1st in
      2024, 2nd in 2025). We also won Google's Hackceler8 finals in 2025, and placed 3rd in 2026.
      Since 2025, I have served on the board as accountant.
  - organization: Kalmarunionen
    position: CTF Player
    startDate: 2024-03-01

  - organization: "DSE - Students' Business Relations"
    position: IT Coordinator
    startDate: 2023-04-01
    endDate: 2025-02-01
    summary: >-
      Previous member of the non-profit non-political organization DSE, whose purpose is to help
      students connect with companies. As a system administrator and developer, I was responsible
      for maintaining and developing both new and existing systems in DSE, which has given me the
      ability to understand, enhance, and refactor code created by previous members. As an event
      coordinator, I was part of a team of six people where we coordinated the DSE Messe Lyngby
      2023, the largest job and career fair for engineering students in Denmark. This provided me
      with experiences in various areas such as logistics, design, and teamwork. I have also worked
      as a sales representative, selling DSE's products through telephone, email, and in-person
      interactions, which has given me experience in sales and communication with customers.
  - organization: "DSE - Students' Business Relations"
